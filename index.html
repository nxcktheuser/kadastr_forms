<style>
/* Layout: sidebar of projects | editor | live document preview. Collapses to one column on phones. Drafting-office palette; boundary red is the only accent. */
:root{
  --bg:#eef1f3; --surface:#ffffff; --ink:#1b2430; --muted:#5b6876; --line:#d3dae1; --soft:#f5f7f9;
  --accent:#c22f29; --accent-ink:#ffffff; --ok:#2d7a4b; --warn:#a86a00; --err:#b3261e; --sel:#fbeceb;
  --f-display:"PT Sans Caption","PT Sans",system-ui,sans-serif;
  --f-body:"PT Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"PT Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161c; --surface:#1a2129; --ink:#e3e8ed; --muted:#93a1af; --line:#2d3742; --soft:#151b22;
  --accent:#ef6159; --accent-ink:#1a0b0a; --ok:#5cc18a; --warn:#e2a93b; --err:#f2827a; --sel:#2a1c1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#1a2129; --ink:#e3e8ed; --muted:#93a1af; --line:#2d3742; --soft:#151b22;
  --accent:#ef6159; --accent-ink:#1a0b0a; --ok:#5cc18a; --warn:#e2a93b; --err:#f2827a; --sel:#2a1c1d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.app{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-size:1.45rem;margin:0;letter-spacing:-.01em}
.brand h1 b{color:var(--accent)}
.store{font-size:.8rem;color:var(--muted)}
.store i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-right:6px;vertical-align:1px}
.store.on i{background:var(--ok)}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr) minmax(0,1.05fr);gap:14px;align-items:start}
@media (max-width:1180px){.layout{grid-template-columns:220px minmax(0,1fr)}.preview{grid-column:1/-1}}
@media (max-width:760px){.layout{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;min-width:0}
/* sidebar */
.side{display:flex;flex-direction:column;padding:12px;gap:12px}
.side h2,.lbl{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:700}
.newbtns{display:flex;flex-direction:column;gap:6px}
.plist{display:flex;flex-direction:column;gap:2px;max-height:52vh;overflow:auto}
.pitem{display:flex;flex-direction:column;gap:1px;text-align:left;border:0;background:transparent;border-radius:4px;padding:7px 8px;cursor:pointer;color:var(--ink);font:inherit}
.pitem:hover{background:var(--soft)}
.pitem.on{background:var(--sel)}

.pitem span{font-size:.75rem;color:var(--muted)}
.tag{display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:3px;border:1px solid currentColor;margin-right:6px}
.tag.mp{color:var(--accent)} .tag.act{color:var(--ok)} .tag.tp{color:var(--warn)}
.empty-side{font-size:.85rem;color:var(--muted)}
/* editor */
.editor{display:flex;flex-direction:column}
.ehead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}

input,select,textarea{font:inherit;font-size:.93rem;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:7px 9px;width:100%;min-width:0}

button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
button.ghost:hover{color:var(--err)}
button:disabled{opacity:.5;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lst{display:flex;flex-direction:column;gap:6px}

.preview{display:flex;flex-direction:column}

.issues{display:flex;flex-direction:column;gap:4px;padding:12px 14px 0;font-size:.84rem}
.issues div{padding:6px 9px;border-radius:4px;background:var(--soft);border-left:3px solid var(--warn)}
.issues div.err{border-left-color:var(--err)}
.issues div.ok{border-left-color:var(--ok)}
.paper{padding:16px 18px 24px;display:flex;flex-direction:column;gap:10px;font-size:.88rem}

.paper .d-title{font-family:var(--f-display);font-size:1.25rem;text-align:center;margin:4px 0 6px;letter-spacing:.04em}
.paper .d-h{font-weight:700;font-size:.95rem;margin:12px 0 0;padding-top:10px;border-top:2px solid var(--ink);text-align:center}
.paper .d-h2{font-weight:700;font-size:.86rem;margin:4px 0 0}
.paper .d-p{margin:0;max-width:78ch;white-space:pre-wrap}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:3px}
table{border-collapse:collapse;width:100%;font-size:.8rem}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
th:last-child,td:last-child{border-right:0}
tr:last-child td{border-bottom:0}
th{background:var(--soft);font-weight:700;color:var(--muted);font-size:.74rem}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
td.k{color:var(--muted);width:44%}
td.empty{color:var(--muted)}
.draw{border:1px solid var(--line);border-radius:3px;background:#fff;overflow-x:auto}
.draw svg{display:block;width:100%;height:auto;min-width:300px}
.sign{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:.84rem}
.sign span{border-top:1px solid var(--ink);padding-top:3px;min-width:160px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;padding:12px 14px 0}
.stat{border:1px solid var(--line);border-radius:4px;padding:8px 10px}
.stat b{display:block;font-family:var(--f-mono);font-size:1.1rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
/* empty main */
.welcome{padding:28px 22px;display:flex;flex-direction:column;gap:12px;max-width:62ch}
.welcome h2{font-family:var(--f-display);margin:0;font-size:1.3rem;text-wrap:balance}
.welcome p{margin:0;color:var(--muted)}
.xmlp{margin:12px 14px 0;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--soft);display:flex;flex-direction:column;gap:8px}
.filebtn{display:inline-flex;flex-direction:row;align-items:center;font-size:.86rem;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:6px 11px;cursor:pointer}
.filebtn input{position:absolute;width:1px;height:1px;opacity:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:4px;font-size:.88rem;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px);z-index:20}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

</head><body>
<div class="app">

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
<script>
"use strict";
/* ================= helpers ================= */
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=(n,d)=>Number(n).toFixed(d).replace(".",",");
const fmtInt=n=>Math.round(n).toLocaleString("ru-RU");
const num=s=>{const v=parseFloat(String(s??"").replace(",","."));return isFinite(v)?v:NaN};
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const ruDate=iso=>{if(!iso)return"";const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);return m?m[3]+"."+m[2]+"."+m[1]:iso};
const D="—";
const or=(s,ph)=>(s&&String(s).trim())?String(s).trim():(ph===undefined?D:ph);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const get=(o,p)=>p.split(".").reduce((a,k)=>a==null?a:a[k],o);
const setp=(o,p,v)=>{const ks=p.split(".");let a=o;ks.slice(0,-1).forEach(k=>{if(a[k]==null||typeof a[k]!=="object")a[k]={};a=a[k]});a[ks[ks.length-1]]=v};
let tt;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2200)}

/* ================= reference data ================= */
const MP_REASONS={
  gm:{label:"Образование ЗУ из земель гос./муниципальной собственности",text:"образованием земельного участка из земель, находящихся в государственной или муниципальной собственности",clar:false},
  split:{label:"Образование ЗУ путём раздела",text:"образованием земельных участков путём раздела земельного участка с кадастровым номером {src}",clar:false},
  merge:{label:"Образование ЗУ путём объединения",text:"образованием земельного участка путём объединения земельных участков с кадастровыми номерами {src}",clar:false},
  vydel:{label:"Образование ЗУ путём выдела",text:"образованием земельного участка путём выдела в счёт доли (долей) в праве общей собственности на земельный участок с кадастровым номером {src}",clar:false},
  clarify:{label:"Уточнение местоположения границ и (или) площади ЗУ",text:"уточнением местоположения границ и (или) площади земельного участка с кадастровым номером {cad}",clar:true}
};
const MT_NORM=[["0.10","0,10 — земли населённых пунктов"],["0.20","0,20 — с/х земли для садоводства, огородничества, ЛПХ, ИЖС, гаражей"],["2.50","2,50 — земли с/х назначения (прочие)"],["0.50","0,50 — земли промышленности и иного спец. назначения"],["2.50ooпт","2,50 — земли ООПТ"],["5.00","5,00 — земли лесного, водного фонда, запаса"]];
const METHODS=["Метод спутниковых геодезических измерений (определений)","Геодезический метод","Фотограмметрический метод","Картометрический метод","Аналитический метод"];
const OBJ_KIND=[["building","здание"],["construction","сооружение"],["room","помещение"],["parking","машино-место"],["ons","объект незавершённого строительства"]];
const END_REASON=[["снос","сносом"],["гибель","гибелью"],["уничтожение","уничтожением"]];

/* ================= geometry ================= */
function parsePts(txt){
  const out=[],errs=[];let auto=1;
  String(txt||"").split(/\r?\n/).forEach((line,i)=>{
    line=line.trim();if(!line)return;
    const tk=line.split(/[\s;\t]+/).filter(Boolean).map(t=>t.replace(",","."));
    let name,x,y;
    if(tk.length>=3){name=tk[0];x=+tk[1];y=+tk[2]}
    else if(tk.length===2){name="н"+auto;x=+tk[0];y=+tk[1]}
    else{errs.push("Строка "+(i+1)+" координат: не хватает значений");return}
    if(!isFinite(x)||!isFinite(y)){errs.push("Строка "+(i+1)+" координат: числа не распознаны");return}
    auto++;out.push({name,x,y});
  });
  if(out.length>2){const a=out[0],b=out[out.length-1];if(a.name===b.name||(Math.abs(a.x-b.x)<1e-6&&Math.abs(a.y-b.y)<1e-6))out.pop()}
  return{pts:out,errs};
}
function geom(p){
  const n=p.length;let s=0,per=0;const sides=[];
  for(let i=0;i<n;i++){const a=p[i],b=p[(i+1)%n];s+=a.x*b.y-b.x*a.y;
    const L=Math.hypot(b.x-a.x,b.y-a.y);per+=L;sides.push({from:a.name,to:b.name,len:L});}
  return{area:Math.abs(s)/2,per,sides};
}
function selfIntersects(p){
  const n=p.length,cr=(a,b,c)=>(b.y-a.y)*(c.x-a.x)-(b.x-a.x)*(c.y-a.y);
  for(let i=0;i<n;i++)for(let j=i+2;j<n;j++){if(i===0&&j===n-1)continue;
    const a=p[i],b=p[(i+1)%n],c=p[j],d=p[(j+1)%n];
    if(cr(a,b,c)*cr(a,b,d)<0&&cr(c,d,a)*cr(c,d,b)<0)return true}
  return false;
}
function drawingSVG(p,label,colors){
  const C=colors||{line:"#c22f29",ink:"#1b2430",muted:"#5b6876",bg:"#ffffff"};
  const W=680,H=460,pad=60;
  const ys=p.map(q=>q.y),xs=p.map(q=>q.x);
  const minY=Math.min(...ys),maxY=Math.max(...ys),minX=Math.min(...xs),maxX=Math.max(...xs);
  const k=Math.min((W-2*pad)/((maxY-minY)||1),(H-2*pad)/((maxX-minX)||1));
  const ox=(W-(maxY-minY)*k)/2,oy=(H-(maxX-minX)*k)/2;
  const P=q=>[ox+(q.y-minY)*k,H-oy-(q.x-minX)*k];
  const pts=p.map(P),cx=pts.reduce((s,q)=>s+q[0],0)/pts.length,cy=pts.reduce((s,q)=>s+q[1],0)/pts.length;
  // scale for ~170 mm print width
  const denom=(W/k)/0.17;const nice=[100,200,250,500,1000,2000,2500,5000,10000,25000];
  const sc=nice.find(n=>n>=denom)||Math.ceil(denom/1000)*1000;
  const F='font-family="PT Sans,Arial,sans-serif"';
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"><rect width="${W}" height="${H}" fill="${C.bg}"/>`;
  s+=`<polygon points="${pts.map(q=>q.map(v=>v.toFixed(1)).join(",")).join(" ")}" fill="${C.line}" fill-opacity="0.06" stroke="${C.line}" stroke-width="2"/>`;
  const g=geom(p);
  g.sides.forEach((sd,i)=>{const a=pts[i],b=pts[(i+1)%pts.length];const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;
    let dx=mx-cx,dy=my-cy;const dl=Math.hypot(dx,dy)||1;dx/=dl;dy/=dl;
    s+=`<text x="${(mx+dx*14).toFixed(1)}" y="${(my+dy*14+4).toFixed(1)}" font-size="11" text-anchor="middle" fill="${C.muted}" ${F}>${fmt(sd.len,2)}</text>`});
  pts.forEach((q,i)=>{let dx=q[0]-cx,dy=q[1]-cy;const dl=Math.hypot(dx,dy)||1;dx/=dl;dy/=dl;
    s+=`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="3.5" fill="${C.bg}" stroke="${C.line}" stroke-width="1.6"/>`;
    s+=`<text x="${(q[0]+dx*18).toFixed(1)}" y="${(q[1]+dy*18+4).toFixed(1)}" font-size="13" font-weight="700" text-anchor="middle" fill="${C.line}" ${F}>${esc(p[i].name)}</text>`});
  s+=`<text x="${cx.toFixed(1)}" y="${(cy+5).toFixed(1)}" font-size="14" text-anchor="middle" fill="${C.ink}" ${F}>${esc(label)}</text>`;
  s+=`<g transform="translate(${W-34},40)"><path d="M0,-22 L7,6 L0,1 L-7,6 Z" fill="${C.ink}"/><text y="22" font-size="12" text-anchor="middle" fill="${C.ink}" ${F}>С</text></g>`;
  s+=`<text x="14" y="${H-14}" font-size="12" fill="${C.muted}" ${F}>Масштаб 1:${sc.toLocaleString("ru-RU")}</text>`;
  s+=`<g transform="translate(${W-230},${H-22})"><line x1="0" y1="0" x2="24" y2="0" stroke="${C.line}" stroke-width="2"/><text x="30" y="4" font-size="11" fill="${C.muted}" ${F}>граница земельного участка</text></g>`;
  return s+"</svg>";
}

/* ================= document text helpers ================= */

   A document is an array of blocks; three renderers (HTML, DOCX, PDF) read the same blocks. */
function mtInfo(m){
  const m0=num(m.m0),m1=num(m.m1);
  const mt=isFinite(m0)&&isFinite(m1)?Math.sqrt(m0*m0+m1*m1):NaN;
  const r2=Math.round(mt*100)/100;
  const formula=isFinite(mt)?"Mt = √(m0² + m1²) = √("+fmt(m0,2)+"² + "+fmt(m1,2)+"²) = "+fmt(r2,2):"";
  const norm=parseFloat(m.mtNorm||"0.10");
  return{mt:r2,formula,norm};
}
function analyzeMP(d){
  const m=d.mp||{};const r=MP_REASONS[m.reason]||MP_REASONS.gm;
  const {pts,errs}=parsePts(m.pts);
  const g=pts.length>=3?geom(pts):null;
  const mi=mtInfo(m);
  const area=g?Math.round(g.area):0;
  const mtUse=isFinite(mi.mt)?mi.mt:mi.norm;
  const dP=g?Math.round(3.5*mtUse*Math.sqrt(area)):0;
  const egrn=parseFloat(String(m.egrnArea||"").replace(",","."));
  const old=parsePts(m.egrnPts).pts;const oldBy={};old.forEach(p=>oldBy[p.name]=p);
  return{m,r,pts,errs,g,mi,area,dP,egrn,oldBy,clar:r.clar};
}

const docCode=v=>((String(v||"").match(/^\d{12}/)||[])[0]||"");
const docCodeName=v=>{const c=docCode(v);const f=c&&ALLDOCS.find(x=>x[0]===c);return f?f[1]:""};
function build(p){return p.type==="act"?buildAct(p.data||{}):p.type==="tp"?buildTP(p.data||{}):buildMP(p.data||{})}

/* ================= validation ================= */
function validate(p){
  const d=p.data||{},I=[];const E=t=>I.push({lvl:"err",t}),W=t=>I.push({lvl:"warn",t});
  if(!d.date)W("Не указана дата подготовки.");
  if(!d.eng||!d.eng.fio)E("Не выбран кадастровый инженер.");
  else{if(!d.eng.snils)W("У инженера не указан СНИЛС.");if(!d.eng.regno)W("У инженера не указан реестровый номер СРО.")}
  const c=d.client||{};if(!(c.fio||c.name))E("Не указан заказчик.");
  if(!contractText(d.contract))W("Не указан договор или иной документ — основание работ.");
  if(p.type==="tp")validateTP(d,E,W);
  else if(p.type==="act"){
    const x=d.act||{};
    if(!x.cad)E("Не указан кадастровый номер объекта.");
    else if(!/^\d{2}:\d{2}:\d{6,7}:\d+$/.test(x.cad.trim()))W("Кадастровый номер объекта выглядит необычно (ожидается вид 54:35:000000:123).");
    if(!x.inspectDate)W("Не указана дата осмотра объекта.");
    if(!(d.actDocs||[]).some(z=>z.name))W("Перечень документов пуст.");
  }else{
    const a=analyzeMP(d),m=a.m;
    a.errs.forEach(E);
    if(!a.pts.length)E("Не введены координаты характерных точек.");
    else if(a.pts.length<3)E("Для контура нужно минимум 3 точки.");
    const names=a.pts.map(q=>q.name),dup=[...new Set(names.filter((n,i)=>names.indexOf(n)!==i))];
    if(dup.length)E("Повторяются обозначения точек: "+dup.join(", ")+".");
    if(a.g&&selfIntersects(a.pts))E("Контур самопересекается: проверьте порядок точек.");
    if(isFinite(a.mi.mt)&&a.mi.mt>a.mi.norm)E("Mt = "+fmt(a.mi.mt,2)+" м превышает нормативную точность "+fmt(a.mi.norm,2)+" м.");
    if(!m.cs)W("Не указана система координат.");
    if(!(m.ggs||[]).some(x=>x.name))W("Не заполнены сведения о пунктах геодезической сети.");
    if(!(m.instr||[]).some(x=>x.name))W("Не заполнены сведения о средствах измерений.");
    if(!(d.docs||[]).some(x=>x.name))W("Перечень исходных документов пуст.");
    if(a.clar){
      if(!m.cad||!/^\d{2}:\d{2}:\d{6,7}:\d+$/.test(m.cad.trim()))E("Для уточнения нужен кадастровый номер участка вида 54:35:000000:123.");
      if(!isFinite(a.egrn))W("Не указана площадь по ЕГРН — расхождение не посчитать.");
      if(a.g&&isFinite(a.egrn)&&a.area>a.egrn){
        const lim=num(m.pMin);const add=isFinite(lim)?lim:a.egrn*0.1;
        if(a.area-a.egrn>add)E("Площадь увеличилась на "+fmtInt(a.area-a.egrn)+" м² — больше, чем "+(isFinite(lim)?"предельный минимальный размер ("+fmtInt(lim)+" м²)":"10% от площади по ЕГРН")+".");
      }
      if(a.pts.some(q=>!a.oldBy[q.name]))W("Для части точек нет координат ЕГРН — в таблице будет прочерк (так и должно быть для новых точек «н»).");
      if(!(m.agree||[]).some(x=>x.from||x.adj))W("Акт согласования не заполнен.");
    }else if(a.g){
      const mn=num(m.pMin),mx=num(m.pMax);
      if(isFinite(mn)&&a.area<mn)E("Площадь "+fmtInt(a.area)+" м² меньше предельного минимального размера "+fmtInt(mn)+" м².");
      if(isFinite(mx)&&a.area>mx)E("Площадь "+fmtInt(a.area)+" м² больше предельного максимального размера "+fmtInt(mx)+" м².");
    }
    if(!m.addr)W("Не указан адрес (местоположение) участка.");
  }
  return I;
}

/* ================= export: drawing to PNG ================= */
function svgToPng(svg,w,h){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{const c=document.createElement("canvas");c.width=w*2;c.height=h*2;const x=c.getContext("2d");x.scale(2,2);x.drawImage(img,0,0,w,h);
      c.toBlob(b=>b?res({blob:b,dataURL:c.toDataURL("image/png")}):rej(new Error("png")),"image/png")};
    img.onerror=()=>rej(new Error("Не удалось отрисовать чертёж"));
    img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
  });
}

/* ================= DOCX renderer (WordprocessingML via JSZip) ================= */
const xe=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function wRun(text,o){o=o||{};const pr=(o.b?"<w:b/>":"")+(o.sz?"<w:sz w:val='"+o.sz+"'/><w:szCs w:val='"+o.sz+"'/>":"");
  return String(text??"").split("\n").map((ln,i)=>(i?"<w:r><w:br/></w:r>":"")+"<w:r>"+(pr?"<w:rPr>"+pr+"</w:rPr>":"")+"<w:t xml:space='preserve'>"+xe(ln)+"</w:t></w:r>").join("")}
function wP(text,o){o=o||{};const ppr="<w:pPr>"+(o.align?"<w:jc w:val='"+o.align+"'/>":"")+"<w:spacing w:before='"+(o.before||0)+"' w:after='"+(o.after==null?80:o.after)+"'/>"+(o.keep?"<w:keepNext/>":"")+"</w:pPr>";
  return"<w:p>"+ppr+wRun(text,o)+"</w:p>"}
const TEXTW=10205;
function wTable(head,rows,widths,numCols,sz){
  sz=sz||18;const tot=widths.reduce((a,b)=>a+b,0);const tw=widths.map(w=>Math.round(w/tot*TEXTW));
  const cell=(t,w,o)=>"<w:tc><w:tcPr><w:tcW w:w='"+w+"' w:type='dxa'/>"+(o.head?"<w:shd w:val='clear' w:color='auto' w:fill='EDEFF2'/>":"")+"</w:tcPr><w:p><w:pPr><w:spacing w:before='0' w:after='0'/>"+(o.right?"<w:jc w:val='right'/>":"")+"</w:pPr>"+wRun(t,{b:o.head,sz})+"</w:p></w:tc>";
  const b="<w:tblBorders>"+["top","left","bottom","right","insideH","insideV"].map(s=>"<w:"+s+" w:val='single' w:sz='4' w:space='0' w:color='000000'/>").join("")+"</w:tblBorders>";
  let x="<w:tbl><w:tblPr><w:tblW w:w='"+TEXTW+"' w:type='dxa'/><w:tblLayout w:type='fixed'/>"+b+"<w:tblCellMar><w:left w:w='70' w:type='dxa'/><w:right w:w='70' w:type='dxa'/></w:tblCellMar></w:tblPr><w:tblGrid>"+tw.map(w=>"<w:gridCol w:w='"+w+"'/>").join("")+"</w:tblGrid>";
  if(head)x+="<w:tr><w:trPr><w:tblHeader/></w:trPr>"+head.map((h,i)=>cell(h,tw[i],{head:true})).join("")+"</w:tr>";
  rows.forEach(r=>{x+="<w:tr><w:trPr><w:cantSplit/></w:trPr>"+r.map((c,i)=>cell(c,tw[i],{right:(numCols||[]).includes(i)})).join("")+"</w:tr>"});
  return x+"</w:tbl>"+wP("",{after:60});
}

/* ================= storage: shared db, local fallback ================= */
const S={mode:"local",db:null,projects:{},engineers:{},cur:null,view:"empty",dirty:false,saving:false,pending:null};
const LKEY="kadastr-forms-v1";
/* on-device storage: IndexedDB (works offline, holds far more than localStorage); localStorage only if IndexedDB is unavailable */
const IDB=(()=>{let dbp=null;
  function open(){if(dbp)return dbp;dbp=new Promise((res,rej)=>{try{if(!window.indexedDB)return rej(new Error("no idb"));const r=indexedDB.open("kadastr-forms",1);
    r.onupgradeneeded=()=>{const d=r.result;["projects","engineers"].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:"id"})})};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return dbp}
  function tx(store,mode,fn){return open().then(d=>new Promise((res,rej)=>{const t=d.transaction(store,mode);const req=fn(t.objectStore(store));t.oncomplete=()=>res(req&&req.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)}))}
  return{all:s=>tx(s,"readonly",st=>st.getAll()),put:(s,o)=>tx(s,"readwrite",st=>st.put(o)),del:(s,id)=>tx(s,"readwrite",st=>st.delete(id))};
})();
function lsLoad(){try{const o=JSON.parse(localStorage.getItem(LKEY)||"null");if(o){S.projects=o.projects||{};S.engineers=o.engineers||{}}}catch(e){}}
function lsSave(){try{localStorage.setItem(LKEY,JSON.stringify({projects:S.projects,engineers:S.engineers}))}catch(e){}}
async function loadLocal(){
  try{
    const [ps,es]=await Promise.all([IDB.all("projects"),IDB.all("engineers")]);
    S.projects={};S.engineers={};(ps||[]).forEach(p=>S.projects[p.id]=p);(es||[]).forEach(e=>S.engineers[e.id]=e);
    if(!ps.length&&!es.length){lsLoad();for(const p of Object.values(S.projects))await IDB.put("projects",Object.assign({},p));for(const e of Object.values(S.engineers))await IDB.put("engineers",Object.assign({},e))}
  }catch(e){S.useLS=true;lsLoad()}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
}
async function initStore(){
  await loadLocal();renderAll();setStore(false);
  let db=null;
  try{if(window.claude&&claude.use)db=await claude.use("db")}catch(e){db=null}
  if(!db){setStore(false);return}
  S.db=db;S.mode="db";S.projects={};S.engineers={};setStore(true);
  db.collection("projects").onSnapshot(snap=>{
    const next={};snap.docs.forEach(d=>{next[d.id]=Object.assign({id:d.id},JSON.parse(JSON.stringify(d.data())))});
    const openId=S.cur&&S.cur.id;
    S.projects=next;
    if(openId&&next[openId]&&!S.dirty&&!S.saving&&next[openId].updatedAt!==S.cur.updatedAt){S.cur=JSON.parse(JSON.stringify(next[openId]));renderEditor();renderPreview();toast("Проект обновлён коллегой")}
    if(openId&&!next[openId]&&!snap.metadata.fromCache&&!S.dirty){S.cur=null;S.view="empty";renderEditor();renderPreview()}
    renderList();
  },e=>{toast("База недоступна: "+(e&&e.code||"ошибка"))});
  db.collection("engineers").onSnapshot(snap=>{
    const next={};snap.docs.forEach(d=>{next[d.id]=Object.assign({id:d.id},JSON.parse(JSON.stringify(d.data())))});
    const changed=Object.keys(next).sort().join()!==Object.keys(S.engineers).sort().join();S.engineers=next;if(S.view==="eng"){if(changed)renderEditor()}else if(S.view==="project"&&changed)refreshEngSelect();
  },()=>{});
}
function setStore(on){if(on!==undefined)S.storeOn=on;const el=$("store");const off=navigator.onLine===false;el.className="store"+(S.storeOn?" on":"");el.innerHTML="<i></i>"+(S.storeOn?"Общая база команды":"Хранится на этом устройстве")+(off?" · без сети":"")}
window.addEventListener("online",()=>setStore());window.addEventListener("offline",()=>setStore());
async function writeDoc(coll,id,body){
  if(S.mode==="db"){await S.db.collection(coll).doc(id).set(body)}
  else{const o=Object.assign({id},JSON.parse(JSON.stringify(body)));(coll==="projects"?S.projects:S.engineers)[id]=o;if(S.useLS)lsSave();else await IDB.put(coll,o)}
}
async function deleteDoc(coll,id){
  if(S.mode==="db")await S.db.collection(coll).doc(id).delete();
  else{delete (coll==="projects"?S.projects:S.engineers)[id];if(S.useLS)lsSave();else await IDB.del(coll,id)}

let saveT;
function scheduleSave(){S.dirty=true;clearTimeout(saveT);saveT=setTimeout(flush,700)}
async function flush(){
  if(!S.cur||S.saving)return;
  S.saving=true;S.dirty=false;
  const p=S.cur;p.updatedAt=new Date().toISOString();
  const {id,...body}=p;
  try{await writeDoc("projects",id,body);if(S.mode==="local")renderList()}
  catch(e){S.dirty=true;toast(e&&e.code==="quota_exceeded"?"База заполнена: удалите старые проекты":e&&e.code==="invalid_argument"?"Нет прав на запись в базу":"Не сохранилось, повторю")}
  finally{S.saving=false;if(S.dirty){clearTimeout(saveT);saveT=setTimeout(flush,1500)}}
}

function L(path,cols,addLabel,tmpl){
  const arr=get(S.cur.data,path)||[];
  const grid=cols.length<=4?"grid-template-columns:"+cols.map(c=>c.w||"1fr").join(" ")+" auto":"grid-template-columns:repeat(auto-fill,minmax(130px,1fr))";
  const span=c=>cols.length>4&&c.w&&parseFloat(c.w)>=1.4?" style='grid-column:span 2'":"";
  return"<div class='lst'>"+arr.map((r,i)=>"<div class='lrow' style='"+grid+"'>"+cols.map(c=>c.select?"<label"+span(c)+">"+esc(c.label)+"<select id='l-"+path+"-"+i+"-"+c.k+"' data-l='"+path+"' data-i='"+i+"' data-k='"+c.k+"'>"+c.select.map(x=>"<option value='"+x[0]+"'"+(r[c.k]===x[0]?" selected":"")+">"+esc(x[1])+"</option>").join("")+"</select></label>"
    :"<label"+span(c)+">"+esc(c.label)+"<input id='l-"+path+"-"+i+"-"+c.k+"' data-l='"+path+"' data-i='"+i+"' data-k='"+c.k+"' type='"+(c.type||"text")+"' value='"+esc(r[c.k]||"")+"'"+(c.ph?" placeholder='"+esc(c.ph)+"'":"")+(c.list?" list='"+c.list+"'":"")+"></label>").join("")+
    "<button type='button' class='ghost rm' data-rm='"+path+"' data-i='"+i+"' aria-label='Удалить строку'>✕</button></div>").join("")+
    "<div class='btns'><button type='button' data-add='"+path+"' data-tmpl='"+esc(JSON.stringify(tmpl||{}))+"'>"+esc(addLabel)+"</button></div></div>";
}

  else if(S.cur.type==="mp"&&b.a&&b.a.g)stats="<div class='stats'>"+[["Площадь, м²",fmtInt(b.a.area)],["±ΔP, м²",fmtInt(b.a.dP)],["Mt, м",fmt(isFinite(b.a.mi.mt)?b.a.mi.mt:b.a.mi.norm,2)],["Периметр, м",fmt(b.a.g.per,2)]].map(s=>"<div class='stat'><b>"+s[1]+"</b><span>"+s[0]+"</span></div>").join("")+"</div>";
  pv.innerHTML="<div class='phead'><h2>"+(S.cur.type==="act"?"Акт обследования":S.cur.type==="tp"?"Технический план":"Межевой план")+"</h2><div class='btns'><button type='button' class='primary' id='xDocx'>Скачать Word</button><button type='button' id='xPdf'>Скачать PDF</button><button type='button' id='xXml'"+(S.xmlOpen?" class='primary'":"")+">Пакет для Росреестра</button></div></div>"+(S.xmlOpen?xmlPanelHTML():"")+
    "<div class='issues'>"+(I.length?I.map(i=>"<div class='"+i.lvl+"'>"+esc(i.t)+"</div>").join(""):"<div class='ok'>Обязательные сведения заполнены, ошибок не найдено.</div>")+"</div>"+stats+

}
async function chertezhPdf(){
  const b=build(S.cur).blocks.find(x=>x.t==="img");
  if(!b)throw new Error("Нет координат — чертёж не собрать.");
  if(!window.pdfMake||!pdfMake.createPdf)throw new Error("Библиотека PDF не загрузилась. Обновите страницу.");
  const png=await svgToPng(drawingSVG(b.pts,b.label),680,460);
  const title=S.cur.type==="tp"?"Чертеж контура объекта недвижимости":"Чертеж земельных участков и их частей";
  const def={pageSize:"A4",pageMargins:[56,40,28,40],content:[{text:title,bold:true,fontSize:12,alignment:"center",margin:[0,0,0,10]},{image:png.dataURL,width:595.28-84},{text:"Кадастровый инженер ____________ "+((S.cur.data.eng||{}).fio||""),fontSize:10,margin:[0,16,0,0]}],defaultStyle:{font:"Roboto"}};
  return new Promise((res,rej)=>{try{pdfMake.createPdf(def).getBlob(b=>res(b))}catch(e){rej(e)}});
}
async function exportXml(zip,btn){
  const old=btn.textContent;btn.disabled=true;btn.textContent="Собираю…";
  try{
    const errs=validateXml(S.cur);if(errs.length)toast("Схема не пройдёт: "+errs.length+" замечаний — файл всё равно собран для проверки");
    const guid=newGuid();const pk=buildXml(S.cur,guid);const base=pk.prefix+guid;
    const dl=await getDownloads();if(!dl){toast("Скачивание недоступно в этом окне. Откройте страницу в claude.ai.");return}
    let blob,name;
    if(!window.JSZip)throw new Error("Библиотека ZIP не загрузилась. Обновите страницу.");
    const z=new JSZip();z.file(base+".xml",pk.xml);
    if(pk.generated.includes("Chertezh.pdf"))z.file("Chertezh.pdf",await chertezhPdf());
    const missing=[];[...new Set(pk.files)].filter(f=>!pk.generated.includes(f)).forEach(f=>{if(S.attach[f])z.file(f,S.attach[f]);else missing.push(f)});
    blob=await z.generateAsync({type:"blob"});name=base+".zip";
    const r=await dl.save({filename:name,data:blob});
    if(r&&r.status==="saved")toast(missing.length?"Пакет сохранён. Не хватает: "+missing.join(", "):"Пакет сохранён");
  }catch(e){const c=e&&e.code;toast(c==="declined"?"Сохранение отменено":c==="rate_limited"?"Окно сохранения уже открыто":c?"Не удалось сохранить ("+c+")":(e&&e.message)||"Не удалось собрать пакет")}
  finally{btn.disabled=false;btn.textContent=old}
}
async function exportAll(btn){
  if(S.dirty)await flush();
  const data={app:"kadastr-forms",version:1,exportedAt:new Date().toISOString(),projects:Object.values(S.projects),engineers:Object.values(S.engineers)};

}
async function importAll(file){
  try{
    const o=JSON.parse(await file.text());if(!o||o.app!=="kadastr-forms")throw new Error("Это не файл «Кадастровых форм».");
    let np=0,ne=0,skip=0;
    for(const e of o.engineers||[]){if(!e.id)continue;const{id,...b}=e;if(!S.engineers[id]){await writeDoc("engineers",id,b);ne++}}
    for(const p of o.projects||[]){if(!p.id)continue;const cur=S.projects[p.id];if(cur&&String(cur.updatedAt)>=String(p.updatedAt)){skip++;continue}const{id,...b}=p;await writeDoc("projects",id,b);np++}
    renderAll();toast("Загружено проектов: "+np+(skip?", пропущено более старых: "+skip:"")+(ne?", инженеров: "+ne:""));
  }catch(e){toast((e&&e.message)||"Файл не прочитался")}
}

let downloads=null;
const plainDownloads={save:async({filename,data})=>{const blob=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},4000);return{status:"saved"}}};
async function getDownloads(){if(downloads)return downloads;if(!window.claude)return downloads=plainDownloads;try{if(claude.use)downloads=await claude.use("downloads")}catch(e){}return downloads}
const fname=ext=>((S.cur.title||"документ").replace(/[\\/:*?"<>|]+/g," ").trim().slice(0,90)||"документ")+"."+ext;
async function exportAs(kind,btn){
  if(!S.cur)return;const old=btn.textContent;btn.disabled=true;btn.textContent="Готовлю…";
  try{
    if(+($("preview").dataset.err||0))toast("В документе есть ошибки — файл всё равно собран");
    const blocks=build(S.cur).blocks;
    const blob=kind==="docx"?await toDocx(blocks,S.cur.title):await toPdf(blocks);
    const dl=await getDownloads();
    if(!dl){toast("Скачивание недоступно в этом окне. Откройте страницу в claude.ai.");return}
    const r=await dl.save({filename:fname(kind),data:blob});
    if(r&&r.status==="saved")toast("Файл сохранён");
  }catch(e){
    const c=e&&e.code;
    toast(c==="declined"?"Сохранение отменено":c==="rate_limited"?"Окно сохранения уже открыто":c?"Не удалось сохранить файл ("+c+")":(e&&e.message)||"Не удалось собрать файл");
  }finally{btn.disabled=false;btn.textContent=old}
}

function renderAll(){renderList();renderEditor();renderPreview()}
function focusEditor(){if(window.innerWidth<760){const ed=$("editor");if(ed&&ed.scrollIntoView)ed.scrollIntoView({behavior:"smooth",block:"start"})}}
document.addEventListener("click",async e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.new){newProject(t.dataset.new);focusEditor();return}
  if(t.dataset.open){if(S.dirty)await flush();const p=S.projects[t.dataset.open];if(p){S.cur=JSON.parse(JSON.stringify(p));S.view="project";renderAll();focusEditor()}return}
  if(t.id==="expAll"){exportAll(t);return}
  if(t.id==="openEng"){if(S.dirty)await flush();S.view="eng";renderAll();return}
  if(t.id==="engBack"){S.view=S.cur?"project":"empty";renderAll();return}
  if(t.id==="engAdd"){const id=uid();S.engOpen=id;const body={fio:""};if(S.mode==="local"){S.engineers[id]=Object.assign({id},body);renderEditor()}try{await writeDoc("engineers",id,body)}catch(er){toast("Не удалось добавить инженера")}return}
  if(t.dataset.edel){t.hidden=true;const y=document.querySelector("[data-edelyes='"+t.dataset.edel+"']");y.hidden=false;setTimeout(()=>{t.hidden=false;y.hidden=true},3500);return}
  if(t.dataset.edelyes){try{await deleteDoc("engineers",t.dataset.edelyes);if(S.mode==="local")renderEditor();toast("Инженер удалён")}catch(er){toast("Не удалось удалить")}return}
  if(!S.cur)return;
  if(t.id==="del"){t.hidden=true;$("delYes").hidden=false;setTimeout(()=>{if($("del")){$("del").hidden=false;$("delYes").hidden=true}},3500);return}
  if(t.id==="delYes"){const id=S.cur.id;clearTimeout(saveT);S.dirty=false;S.cur=null;S.view="empty";try{await deleteDoc("projects",id)}catch(er){toast("Не удалось удалить")}delete S.projects[id];renderAll();toast("Проект удалён");return}
  if(t.id==="dup"){const c=JSON.parse(JSON.stringify(S.cur));c.id=uid();c.title=(c.title||"")+" (копия)";S.projects[c.id]=c;S.cur=c;await flush();renderAll();toast("Создана копия");return}
  if(t.id==="useAuto"){const d=S.cur.data;if(S.cur.type==="act")setp(d,"act.conclusion",autoActConclusion(d));else if(S.cur.type==="tp")setp(d,"tp.conclusion",autoTPConclusion(d,analyzeTP(d)));else setp(d,"mp.conclusion",autoMPConclusion(d,analyzeMP(d)));renderEditor();scheduleSave();schedulePreview();return}
  if(t.id==="engRefresh"){const ref=S.cur.data.eng&&S.cur.data.eng.ref,e2=S.engineers[ref];if(e2){const{id,...e}=e2;S.cur.data.eng=Object.assign({ref:id},e);refreshEngSelect();scheduleSave();schedulePreview();toast("Реквизиты обновлены")}else toast("Инженер удалён из справочника");return}
  if(t.dataset.add){const arr=get(S.cur.data,t.dataset.add)||[];arr.push(JSON.parse(t.dataset.tmpl||"{}"));setp(S.cur.data,t.dataset.add,arr);rerenderKeepOpen();scheduleSave();schedulePreview();return}
  if(t.dataset.rm){const arr=get(S.cur.data,t.dataset.rm)||[];arr.splice(+t.dataset.i,1);rerenderKeepOpen();scheduleSave();schedulePreview();return}
  if(t.id==="xDocx"){exportAs("docx",t);return}
  if(t.id==="xPdf"){exportAs("pdf",t);return}
  if(t.id==="xXml"){S.xmlOpen=!S.xmlOpen;renderPreview();return}
  if(t.id==="xZip"){exportXml(true,t);return}
  if(t.id==="xmlClear"){S.attach={};renderPreview();return}
});
